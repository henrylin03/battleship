<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>

  <body>
    <header>
      <h1>Battleship</h1>
    </header>

    <main>
      <section id="grids">
        <div class="grid-container">
          <p>You</p>
          <button type="button" id="randomise-ships-button">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="icon icon-tabler icons-tabler-outline icon-tabler-arrows-shuffle"
            >
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M18 4l3 3l-3 3" />
              <path d="M18 20l3 -3l-3 -3" />
              <path d="M3 7h3a5 5 0 0 1 5 5a5 5 0 0 0 5 5h5" />
              <path
                d="M21 7h-5a4.978 4.978 0 0 0 -3 1m-4 8a4.984 4.984 0 0 1 -3 1h-3"
              />
            </svg>
          </button>
          <article class="grid" id="your-grid"></article>
        </div>

        <div class="grid-container">
          <p>Opponent</p>
          <article class="grid" id="opponent-grid"></article>
        </div>
      </section>

      <button type="button" id="start-button">Start game</button>
    </main>
  </body>
</html>
