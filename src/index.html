<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
  </head>

  <body>
    <header>
      <h1>Battleship</h1>
    </header>

    <main>
      <div id="status">
        <p>Arrange your ships</p>
      </div>

      <section id="grids">
        <div class="grid-container">
          <p>You</p>
          <article class="grid" id="your-grid"></article>
        </div>

        <div class="grid-container">
          <p>Opponent</p>
          <article class="grid" id="opponent-grid"></article>
        </div>
      </section>

      <button type="button" id="start-button">Start game</button>
    </main>
  </body>
</html>
